<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blogger Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- Custom Styles --- */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            /* Soft gray-blue background */
        }

        /* Gradient Navbar */
        .navbar {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Card Hover Animation */
        .card {
            border: none;
            border-radius: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            /* Moves up slightly */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* Round Buttons */
        .btn {
            border-radius: 50px;
            padding-left: 20px;
            padding-right: 20px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/blogs">
                ✨ Blogger Pro
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">

                    {% if session.get('user_id') %}
                    <li class="nav-item">
                        <span class="text-white fw-light me-2">Welcome, {{ session.username }}</span>
                    </li>
                    <li class="nav-item">
                        <a href="/create" class="btn btn-light text-primary fw-bold shadow-sm">+ New Post</a>
                    </li>
                    <li class="nav-item">
                        <a href="/logout" class="btn btn-outline-light">Logout</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a href="/login" class="btn btn-light text-primary fw-bold">Login</a>
                    </li>
                    <li class="nav-item">
                        <a href="/" class="btn btn-outline-light">Register</a>
                    </li>
                    {% endif %}

                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
