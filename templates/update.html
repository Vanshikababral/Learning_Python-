{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card p-5 mx-auto shadow-lg border-0" style="max-width: 700px;">
        <h2 class="text-center mb-4 fw-bold text-warning">Edit Your Story</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Author Name</label>
                    <input type="text" name="author" value="{{ blog.author }}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Blog Title</label>
                    <input type="text" name="title" value="{{ blog.title }}" class="form-control" required>
                </div>
            </div>

            <div class="mt-3">
                <label class="form-label fw-bold">Update Image</label>
                <input type="file" name="image" class="form-control">
                <small class="text-muted">Leave empty to keep current image</small>
            </div>

            <div class="mt-3">
                <label class="form-label fw-bold">Content</label>
                <textarea name="content" class="form-control" rows="6" required>{{ blog.content }}</textarea>
            </div>

            <div class="d-flex gap-2 mt-4">
                <a href="/blogs" class="btn btn-secondary w-50 py-2">Cancel</a>
                <button type="submit" class="btn btn-warning w-50 py-2 shadow-sm">Update Post ✏️</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
