{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card p-5 mx-auto shadow-lg border-0" style="max-width: 700px;">
        <h2 class="text-center mb-4 fw-bold text-primary">Write a New Story</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Author Name</label>
                    <input type="text" name="author" class="form-control" placeholder="e.g. John Doe" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Blog Title</label>
                    <input type="text" name="title" class="form-control" placeholder="Catchy Title..." required>
                </div>
            </div>

            <div class="mt-3">
                <label class="form-label fw-bold">Cover Image</label>
                <input type="file" name="image" class="form-control">
            </div>

            <div class="mt-3">
                <label class="form-label fw-bold">Content</label>
                <textarea name="content" class="form-control" rows="6" placeholder="Start writing here..."
                    required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4 py-2 fs-5 shadow-sm">
                Publish Post 📤
            </button>
        </form>
    </div>
</div>
{% endblock %}
